<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Do you love me?</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe6ea;--bg2:#ffcad6;--card:#fff9fa;--ink:#3b2230;--sub:#a1707f;--btn:#ff5d78;--frame:#ffeef1;--shadow:rgba(255,93,120,.25);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg1:#2a1420;--bg2:#3d1b2b;--card:#4a2433;--ink:#fff0f3;--sub:#e3aebb;--frame:#5b2e40;--shadow:rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg1:#2a1420;--bg2:#3d1b2b;--card:#4a2433;--ink:#fff0f3;--sub:#e3aebb;--frame:#5b2e40;--shadow:rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:'Quicksand',system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
.float{position:fixed;bottom:-40px;pointer-events:none;opacity:.5;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
#question-container{position:relative;z-index:1;width:min(92vw,400px);height:min(88dvh,580px);background:var(--card);border-radius:28px;box-shadow:0 20px 50px var(--shadow);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.view{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2.2dvh,16px)}
.frame{position:relative;width:min(170px,27dvh);aspect-ratio:1;background:var(--frame);border-radius:24px;animation:bob 2.4s ease-in-out infinite alternate}
.frame svg,.duo svg{width:100%;height:100%;display:block}
.bubble{position:absolute;top:-10px;right:-18px;background:#fff;color:#333;font-weight:700;padding:3px 12px;border-radius:14px 14px 14px 2px;font-size:1.05rem;box-shadow:0 4px 10px var(--shadow)}
@keyframes bob{to{transform:translateY(-6px)}}
h1{font-size:clamp(1.5rem,6.2vw,2rem);margin:0;line-height:1.15}
.sub{margin:0;color:var(--sub);font-weight:500;font-size:.95rem;min-height:1.3em}
button{font-family:inherit;font-weight:700;font-size:1rem;color:#fff;background:var(--btn);border:0;border-radius:999px;padding:11px 28px;cursor:pointer;box-shadow:0 6px 14px var(--shadow);transition:transform .15s}
button:hover{transform:scale(1.06)}
.btns{display:flex;gap:26px;align-items:center}
#noBtn{position:absolute;z-index:2;background:#ff8fa3;transition:left .25s ease,top .25s ease}
#heartLoader{display:none;flex-direction:column;align-items:center;gap:10px}
#heartLoader .h{font-size:76px;animation:beat .6s infinite alternate}
@keyframes beat{to{transform:scale(1.3)}}
#resultContainer{display:none;flex-direction:column;align-items:center;gap:clamp(4px,1.4dvh,10px)}
#gifResult{width:min(190px,29dvh);aspect-ratio:1;transform:scale(0)}
#gifResult.playing{animation:pop .6s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes pop{to{transform:scale(1)}}
.cats{width:min(170px,24dvh);aspect-ratio:200/110;animation:bob 1s ease-in-out infinite alternate}
.ghost{background:transparent;color:var(--btn);box-shadow:none;border:2px solid var(--btn);padding:7px 20px;font-size:.9rem;margin-top:4px}
</style>
</head>
<body>

<circle cx="134" cy="56.5" r="1.2" fill="#fff"/><circle cx="158" cy="56.5" r="1.2" fill="#fff"/>

</symbol></defs></svg>
<div id="question-container">
  <div id="main" class="view">
    <div class="frame"><span class="bubble">皮?</span><svg viewBox="0 0 200 200"><use href="#duo"/></svg></div>
    <h1>Do you love me?</h1>
    <p class="sub" id="tries"></p>
    <div class="btns"><button id="yesBtn">Yes</button><span style="width:86px"></span></div>
  </div>
  <button id="noBtn">No</button>
  <div id="heartLoader"><div class="h">💗</div><p class="sub">Checking your answer…</p></div>
  <div id="resultContainer">
    <div id="gifResult"><svg viewBox="0 0 200 200" width="100%" height="100%"><use href="#duo"/><text x="95" y="60" font-size="26">💗</text><text x="50" y="45" font-size="16">💗</text><text x="140" y="50" font-size="18">💗</text></svg></div>
    <svg class="cats" viewBox="0 0 200 110"><use href="#cats"/></svg>
    <h1>I love you too!</h1>
    <p class="sub">Forever and always 💞</p>
    <button class="ghost" id="again">Ask again</button>
  </div>
</div>
<script>
const questionContainer = document.getElementById("question-container");
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const heartLoader = document.getElementById("heartLoader");
const resultContainer = document.getElementById("resultContainer");
const gifResult = document.getElementById("gifResult");
const main = document.getElementById("main");
const tries = document.getElementById("tries");
let count = 0, timeoutId;

// stand-in for a GIF/video element: gifResult.play() starts the animation
gifResult.play = () => gifResult.classList.add("playing");

function home() {
  const y = yesBtn.getBoundingClientRect(), c = questionContainer.getBoundingClientRect();
  noBtn.style.left = `${y.right - c.left + 26}px`;
  noBtn.style.top = `${y.top - c.top}px`;
}
window.addEventListener("load", home);
window.addEventListener("resize", home);

noBtn.addEventListener("mouseover", () => {
  const newX = Math.floor(Math.random() *
                          questionContainer.offsetWidth);
  const newY = Math.floor(Math.random() *
                          questionContainer.offsetHeight);
  // keep the button inside the card
  const x = Math.min(newX, questionContainer.offsetWidth - noBtn.offsetWidth - 8);
  const y = Math.min(newY, questionContainer.offsetHeight - noBtn.offsetHeight - 8);

  noBtn.style.left = `${Math.max(8, x)}px`;
  noBtn.style.top = `${Math.max(8, y)}px`;
  count++;
  tries.textContent = count === 1 ? "Nice try 😏" : `Attempts to say no: ${count}`;
});
noBtn.addEventListener("touchstart", e => { e.preventDefault(); noBtn.dispatchEvent(new Event("mouseover")); }, { passive: false });

yesBtn.addEventListener("click", () => {
  main.style.display = "none";
  noBtn.style.display = "none";
  heartLoader.style.display = "flex";
  timeoutId = setTimeout(() => {
    heartLoader.style.display = "none";
    resultContainer.style.display = "inherit";
    gifResult.play();
  }, 3000);
});

document.getElementById("again").addEventListener("click", () => {
  clearTimeout(timeoutId);
  resultContainer.style.display = "none";
  gifResult.classList.remove("playing");
  main.style.display = "";
  noBtn.style.display = "";
  count = 0; tries.textContent = "";
  home();
});

// drifting background hearts
for (let i = 0; i < 14; i++) {
  const h = document.createElement("span");
  h.className = "float";
  h.textContent = ["💗", "💕", "🤍"][i % 3];
  h.style.left = `${Math.random() * 100}vw`;
  h.style.fontSize = `${14 + Math.random() * 22}px`;
  h.style.animationDuration = `${9 + Math.random() * 9}s`;
  h.style.animationDelay = `${-Math.random() * 14}s`;
  document.body.appendChild(h);
}
</script>
</body>
</html>
